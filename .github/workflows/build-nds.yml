name: Build Ragnarok Violet NDS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ragnarok-violet-nds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          test -f "$DEVKITARM/ds_rules"
          command -v make
          command -v arm-none-eabi-g++
          command -v ndstool
          command -v python3
          arm-none-eabi-g++ --version | head -n 1

      - name: Static acceptance test
        run: python3 tests/ragnarok_firstpass_test.py

      - name: Build ROM
        run: |
          set -euo pipefail
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          set -o pipefail
          make -j2 PYTHON=python3 2>&1 | tee build.log

      - name: Verify ROM
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          out = Path('Ragnarok Violet.nds')
          raw = Path('Ragnarok_Violet.nds')
          if not out.is_file():
              raise SystemExit('Ragnarok Violet.nds was not produced')
          if raw.exists():
              raise SystemExit('Unexpected duplicate ROM: Ragnarok_Violet.nds')
          data = out.read_bytes()
          if len(data) != 32 * 1024 * 1024:
              raise SystemExit(f'Unexpected ROM size: {len(data)}')
          if data[12:16] != b'CDLG':
              raise SystemExit(f'Unexpected game code: {data[12:16]!r}')
          if int.from_bytes(data[0x20:0x24], 'little') != 0x8000:
              raise SystemExit('Unexpected ARM9 ROM offset')
          print(f'Verified {out}: {len(data):,} bytes, code=CDLG')
          PYCODE

      - name: Upload ROM and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ragnarok-Violet-NDS-${{ github.run_number }}
          path: |
            Ragnarok Violet.nds
            build.log
          if-no-files-found: warn
          retention-days: 30
